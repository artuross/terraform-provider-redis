name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # in CI moon diffs against a base revision to find affected tasks; the shallow checkout doesn't have `main`, and the
  # tasks below run always (runInCI: "always") anyway, so compare against the current commit
  MOON_BASE: HEAD

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:moonrepo/moon"

      - run: moon run root:build

  check-docs:
    name: Check docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go opentofu nushell aqua:hashicorp/terraform-plugin-docs aqua:moonrepo/moon"

      - run: moon run root:docs-check

  check-examples:
    name: Check examples (${{ matrix.tool }})
    runs-on: ubuntu-26.04
    strategy:
      # run with both even if one fails
      fail-fast: false
      matrix:
        tool:
          - terraform
          - tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:moonrepo/moon opentofu terraform"

      # the execute task of every examples/* project, one at a time so the logs don't interleave;
      # moon stops at the first failing example.
      - run: moon run --concurrency 1 :execute --query "project~examples/*"
        env:
          TERRAFORM_BINARY: ${{ matrix.tool }}

  check-format:
    name: Check formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go opentofu aqua:golangci/golangci-lint aqua:moonrepo/moon"

      - run: moon run :format-check

  check-lint:
    name: Check linter
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:golangci/golangci-lint aqua:moonrepo/moon"

      - run: moon run :lint
