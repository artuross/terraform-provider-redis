name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch/PR cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # in CI moon diffs against a base revision to find affected tasks; the shallow checkout doesn't have `main`, and the
  # tasks below run always (runInCI: "always") anyway, so compare against the current commit
  MOON_BASE: HEAD

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:moonrepo/moon"

      - run: moon run root:build

  check-docs:
    name: Check docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go opentofu nushell aqua:hashicorp/terraform-plugin-docs aqua:moonrepo/moon"

      - run: moon run root:docs-check

  check-examples:
    name: Check examples (${{ matrix.tool }})
    runs-on: ubuntu-26.04
    strategy:
      # run with both even if one fails
      fail-fast: false
      matrix:
        tool:
          - terraform
          - tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:moonrepo/moon ${{ matrix.tool }}"

      # the execute task of every examples/* project, one at a time so the logs don't interleave;
      # moon stops at the first failing example.
      - run: moon run --concurrency 1 :execute --query "project~examples/*"
        env:
          TERRAFORM_BINARY: ${{ matrix.tool }}

  check-format:
    name: Check formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go opentofu aqua:golangci/golangci-lint aqua:moonrepo/moon"

      - run: moon run :format-check

  check-lint:
    name: Check linter
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:golangci/golangci-lint aqua:moonrepo/moon"

      - run: moon run :lint

  test-integration:
    name: Run integration tests (${{ matrix.runtime.tool }}, ${{ matrix.image }})
    runs-on: ubuntu-26.04
    strategy:
      # run every version even if one fails
      fail-fast: false
      matrix:
        image:
          - redis:7.0.15-alpine3.20
          - redis:7.2.17-alpine3.21
          - redis:7.4.12-alpine3.21
          - redis:8.0.6-alpine3.21
          - redis:8.2.11-alpine3.22
          - redis:8.4.8-alpine3.22
          - redis:8.6.8-alpine3.23
          - redis:8.8.4-alpine3.23
          - redis:8.10.3-alpine3.23
          - valkey/valkey:7.2.15-alpine3.24
          - valkey/valkey:8.0.12-alpine3.24
          - valkey/valkey:8.1.11-alpine3.24
          - valkey/valkey:9.0.7-alpine3.24
          - valkey/valkey:9.1.3-alpine3.24
        runtime:
          - tool: opentofu
            binary: tofu
          - tool: terraform
            binary: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:moonrepo/moon ${{ matrix.runtime.tool }}"

      - run: moon run :test-integration
        env:
          REDIS_IMAGE: ${{ matrix.image }}
          TERRAFORM_BINARY: ${{ matrix.runtime.binary }}

  test-unit:
    name: Run unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:moonrepo/moon"

      - run: moon run :test-unit
