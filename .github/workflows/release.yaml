name: Release

# push a tag like v0.1.0 to build, sign and publish a GitHub release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the tags and history for the changelog
          fetch-depth: 0
          persist-credentials: false

      # no cache for releases
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: "go aqua:goreleaser/goreleaser"
          cache: false

      # the key whose public part is added to the Terraform Registry
      # goreleaser signs the checksums with it
      - id: gpg
        uses: $/.github/actions/gpg-import
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
