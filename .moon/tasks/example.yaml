$schema: "../cache/schemas/tasks.json"

# shared tasks for every example in examples/<name>
#
# each example has its own compose.yaml (Redis) and example/main.tf. Terraform uses the locally built
# provider through dev_overrides (bin/terraformrc, generated by `moon run root:build`), so no
# `terraform init` is needed.
inheritedBy:
  tags: ["example"]

taskOptions:
  cache: false
  runInCI: false

tasks:
  compose-up:
    description: "Start Redis for this example."
    command: "docker compose up --detach --wait"
    options:
      runInCI: "always"
    toolchains: ["system"]

  compose-down:
    description: "Stop Redis and remove its data together with the Terraform state."
    script: "docker compose down --volumes && rm -f example/terraform.tfstate example/terraform.tfstate.backup"
    toolchains: ["system"]

  execute:
    description: "Plan, apply, check that a second plan has no changes, and destroy, without prompts (used in CI)."
    script: >-
      "${TERRAFORM_BINARY:-tofu}" -chdir=example plan -input=false &&
      "${TERRAFORM_BINARY:-tofu}" -chdir=example apply -auto-approve -input=false &&
      "${TERRAFORM_BINARY:-tofu}" -chdir=example plan -detailed-exitcode -input=false &&
      "${TERRAFORM_BINARY:-tofu}" -chdir=example destroy -auto-approve -input=false
    deps: ["root:build", "compose-up"]
    env:
      TF_CLI_CONFIG_FILE: "$workspaceRoot/bin/terraformrc"
    options:
      runInCI: "always"
    toolchains: ["system"]

  format:
    description: "Format the example's Terraform files."
    command: "${TERRAFORM_BINARY:-tofu}"
    args: ["fmt", "-recursive"]
    toolchains: ["system"]

  format-check:
    description: "Check that the example's Terraform files are formatted (fix with `moon run <example>:format`)."
    command: "${TERRAFORM_BINARY:-tofu}"
    args: ["fmt", "-check", "-diff", "-recursive"]
    inputs:
      - "**/*.tf"
    options:
      cache: true
      runInCI: "always"
    toolchains: ["system"]

  terraform-apply:
    description: "Load the function libraries into Redis."
    command: "${TERRAFORM_BINARY:-tofu}"
    args: ["-chdir=example", "apply"]
    deps: ["root:build", "compose-up"]
    env:
      TF_CLI_CONFIG_FILE: "$workspaceRoot/bin/terraformrc"
    options:
      interactive: true
    toolchains: ["system"]

  terraform-destroy:
    description: "Delete the function libraries from Redis."
    command: "${TERRAFORM_BINARY:-tofu}"
    args: ["-chdir=example", "destroy"]
    deps: ["root:build", "compose-up"]
    env:
      TF_CLI_CONFIG_FILE: "$workspaceRoot/bin/terraformrc"
    options:
      interactive: true
    toolchains: ["system"]

  terraform-plan:
    description: "Show what Terraform would change."
    command: "${TERRAFORM_BINARY:-tofu}"
    args: ["-chdir=example", "plan"]
    deps: ["root:build", "compose-up"]
    env:
      TF_CLI_CONFIG_FILE: "$workspaceRoot/bin/terraformrc"
    toolchains: ["system"]
